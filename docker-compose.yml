services:
  pam-analyzer:
    image: ghcr.io/callmetechie/new-pam-analyzer:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - pam-data:/data
    environment:
      # Public address; with https:// the session cookie is marked secure.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TIME_ZONE: ${TIME_ZONE:-Europe/Berlin}

volumes:
  pam-data:
