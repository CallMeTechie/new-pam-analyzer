name: App

# Builds and publishes the Windows app.
#   git tag app-v0.2.0          -> stable release, channels "stable" and "beta"
#   git tag app-v0.3.0-beta.1   -> pre-release, channel "beta" only
# The app reads its channel from the release "app-updates" (stable.json / beta.json) and installs
# only updates signed with the key in the secret TAURI_SIGNING_PRIVATE_KEY (see docs/app.md).

on:
  push:
    tags: ["app-v*"]

permissions:
  contents: write

concurrency:
  group: app-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - name: Check signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing (see docs/app.md)."
            exit 1
          fi

      - id: version
        name: Version from tag
        run: |
          version=$(node .github/scripts/app-release.mjs version "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "beta=true" >> "$GITHUB_OUTPUT"; else echo "beta=false" >> "$GITHUB_OUTPUT"; fi

      - run: pnpm install --frozen-lockfile

      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @pam/client tauri build

      - name: Collect files
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p out
          dir=apps/client/src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*-setup.exe | head -n 1)
          cp "$exe" "out/PAM-Analyzer_${v}_x64-setup.exe"
          cp "$exe.sig" "out/PAM-Analyzer_${v}_x64-setup.exe.sig"
          node .github/scripts/app-release.mjs notes "$v" out/notes.md
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/PAM-Analyzer_${v}_x64-setup.exe"
          node .github/scripts/app-release.mjs channel "$v" "$url" "out/PAM-Analyzer_${v}_x64-setup.exe.sig" out/notes.md out/channel.json
          cat out/channel.json

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          flags="--latest"
          if [ "${{ steps.version.outputs.beta }}" = "true" ]; then flags="--prerelease --latest=false"; fi
          gh release create "$GITHUB_REF_NAME" \
            "out/PAM-Analyzer_${v}_x64-setup.exe" "out/PAM-Analyzer_${v}_x64-setup.exe.sig" \
            --title "PAM Analyzer App ${v}" --notes-file out/notes.md $flags

      - name: Publish update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view app-updates > /dev/null 2>&1; then
            gh release create app-updates --prerelease --latest=false --title "App update channels" \
              --notes "Update channels of the PAM Analyzer app (stable.json, beta.json). Do not delete."
          fi
          cp out/channel.json out/beta.json
          files="out/beta.json"
          if [ "${{ steps.version.outputs.beta }}" = "false" ]; then
            cp out/channel.json out/stable.json
            files="$files out/stable.json"
          fi
          gh release upload app-updates $files --clobber
