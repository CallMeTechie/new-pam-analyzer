name: Image

# Builds the Docker image and publishes it to the GitHub Container Registry.
# On main: ghcr.io/<owner>/<repo>:latest, :sha-<commit> and the version from
# apps/server/package.json (e.g. :0.2.0 and :0.2). The matching git tag v0.2.0
# is created automatically if it does not exist yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Read version
        run: |
          version=$(node -p "require('./apps/server/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=PAM Analyzer
            org.opencontainers.image.description=PAM Analyzer server with web interface
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create git tag for the version
        if: github.ref == 'refs/heads/main'
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag exists already"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
